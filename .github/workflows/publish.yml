name: Publish to NuGet

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          7.0.x
          8.0.x

    - name: Check the tag matches the package version
      run: |
        version=$(grep -oP '(?<=<Version>)[^<]+' mk.helpers/mk.helpers.csproj)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "Tag $GITHUB_REF_NAME doesn't match the package version $version"
          exit 1
        fi

    - name: Test
      run: dotnet test mk.helpers.sln --verbosity normal

    - name: Pack
      run: dotnet pack mk.helpers/mk.helpers.csproj -c Release -o artifacts

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
